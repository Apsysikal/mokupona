app = "mokupona-stack-b568"
kill_signal = "SIGINT"
kill_timeout = 5
processes = [ ]
swap_size_mb = 512

[env]
DATABASE_URL = "file:/data/sqlite.db"
# volume-backed so phase 1→2 window uploads (local provider) survive
# restarts until the backfill moves them to Cloudinary
IMAGE_UPLOAD_FOLDER = "/data/image-uploads"
# glibc arena cap: without it, freed sharp/libvips buffers stay resident and
# RSS ratchets up (see docs/staging-memory-investigation/findings.md)
MALLOC_ARENA_MAX = "2"
MAIL_PROVIDER = "resend"
PORT = "8080"

[experimental]
auto_rollback = true

[mounts]
source = "data"
destination = "/data"

[http_service]
internal_port = 8080
force_https = true

  [[http_service.checks]]
  interval = "10s"
  grace_period = "5s"
  method = "GET"
  path = "/healthcheck"
  timeout = "2s"
